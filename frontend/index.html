<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transcriptor ASR - Kichwa</title>
    <meta name="description" content="Transcriptor de audio en lengua Kichwa usando redes neuronales">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=9">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

    <section id="pantalla-1" class="pantalla activa">
        <div class="tarjeta">
            <h1 class="titulo-card">TRANSCRIPTOR KICHWA</h1>
            <p class="desc-card">Selecciona un archivo .wav o .mp3 para que el sistema lo analice y devuelva su transcripción.</p>

            <div class="contenedor-input">
                <input type="file" id="audioInput" accept=".wav, .mp3" hidden>
                <label for="audioInput" class="boton-archivo" id="labelArchivo">
                    <span class="icono-archivo">♫</span>
                    Elegir Archivo (.WAV o .MP3)
                </label>
            </div>

            <button id="btnTranscribir" class="boton-accion" disabled>Transcribir Audio</button>
        </div>
    </section>

    <section id="pantalla-2" class="pantalla">
        <div class="tarjeta">
            <h1 class="titulo-card parpadeo">Transcribiendo audio...</h1>
            <p class="desc-card">Por favor espera mientras el sistema procesa tu archivo.</p>
            <div class="spinner"></div>
        </div>
    </section>

    <section id="pantalla-3" class="pantalla">
        <div class="tarjeta tarjeta-resultado">
            <h1 class="titulo-card">TEXTO TRANSCRITO</h1>
            <p class="desc-card">Traducción generada exitosamente.</p>

            <div class="resultado-box">
                <p id="textoResultado" class="texto-resultado">Aquí aparecerá el texto en Kichwa...</p>
            </div>

            <div class="contenedor-botones">
                <button id="btnDescargarTXT" class="boton-descarga">Descargar .TXT</button>
                <button id="btnDescargarPDF" class="boton-descarga">Descargar .PDF</button>
                <button id="btnNuevoAudio" class="boton-secundario">Subir otro audio</button>
            </div>
        </div>
    </section>

    <script src="js/app.js"></script>
</body>
</html>
